<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Charleston Clean Routine</title>
  </head>
  <body>
    <form name="cleaning-plan" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="cleaning-plan" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="zipcode" />
      <input name="property" />
      <input name="bedrooms" />
      <input name="bathrooms" />
      <input name="squareFeet" />
      <input name="condition" />
      <input name="lastClean" />
      <input name="pets" />
      <input name="serviceType" />
      <input name="extras" />
      <input name="frequency" />
      <input name="timing" />
      <input name="turnoverWindow" />
      <input name="linenPlan" />
      <textarea name="accessNotes"></textarea>
      <input name="recommendation" />
      <input name="isRental" />
    </form>
  </body>
</html>
